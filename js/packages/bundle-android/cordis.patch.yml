# DSH-Android profile layer. Applied after @deepseek-ai/dsh-base and
# @deepseek-ai/dsh-sdk-app (see the `android` profile template); the user's
# profile cordis.patch.yml and $DSH_HOME/cordis.patch.yml still apply on top.
#
# A patch replaces a row's whole `config`, so every config below is complete.

# ── persona ────────────────────────────────────────────────────────────────
- id: system-prompt
  config:
    personaPrefix: >-
      You are DSH, an AI agent running on the user's own Android phone, powered
      by the {{model}} model.

# ── workspace: the app-private home directory, never the process cwd ─────────
# The JNI launcher does not chdir; HOME is <filesDir>/home (ENGINE-CONTRACT §1).
- id: sandbox-policy
  config:
    # Android has no bwrap/landlock/seatbelt chain (sandbox-local would fail
    # closed). Run unconfined; mutating tools are approval-gated instead
    # (plugin-guard for shell/fs writes, plugin-device for device tools).
    mode: danger-full-access
    workspaceRoot: !!js "process.env.HOME || process.cwd()"

- id: approval
  config:
    policy: ask

- id: permission
  config:
    defaultPreset: android
    presets:
      android:
        sandbox: danger-full-access
        approval: ask
        name: android
        description: No OS sandbox on Android; every mutating action asks for approval.

# ── rows a phone does not need ───────────────────────────────────────────────
# Profile/package management is a Web/desktop surface (config-editor stays:
# dsh-settings, which stores the llm-deepseek settings section, depends on it).
- id: plugin-manager
  disabled: true
# Telemetry export is off on the phone (privacy; no feedback UI wired to it).
- id: session-telemetry-otel
  disabled: true
# Programmatic tool calling (code execution runtime + workflow tool built on it).
- id: ptc-runtime
  disabled: true
- id: workflow-ptc
  disabled: true
- id: tool-workflow
  disabled: true
# Office skills / primary-runtime dependency tooling (desktop only; also gated by env).
- id: skill-office
  disabled: true
- id: workspace-dependencies
  disabled: true
# tmux context is meaningless on Android (no tmux).
- id: tmux-context
  disabled: true
# Cold start: the OTel exporter stack (+ got) and the pi-ai multi-provider adapter (+ openai,
# Anthropic, Google, Bedrock SDKs) were ~half of all modules loaded at boot (1002 → ~500).
# Telemetry export is off on the phone. Third-party models go through the much lighter
# llm-service-lite row below instead; build-engine.sh prunes the provider SDKs only pi-ai reaches.
- id: otel
  disabled: true
- id: llm-pi-ai
  disabled: true

# ── rows dsh-base leaves to the Web presets ─────────────────────────────────
# Current date/time/zone on each request (relative tasks: "alarm tomorrow 7:00", "SMS from the
# last hour", rule_create epochs). The zone is the process zone: the app sets TZ /
# DSH_ANDROID_TZ (android-env applies it); SDK prompts carry it as clientTimeZone (patch 11).
- insert:
    - id: time-context
      name: '@deepseek-ai/dsh-time-context'
      config:
        refreshIntervalMs: 600000
    # Structured clarifying questions (ask_user_question → user-question/ask, patch 08); the app
    # shows tap-to-choose cards. Unattended runs get automatic "nobody is available" answers
    # from plugin-guard.
    - id: tool-ask-user
      name: '@deepseek-ai/dsh-tool-ask-user'

# ── third-party model providers ─────────────────────────────────────────────
# @snnh/dsh-llm-service-lite (vendored, MIT): OpenAI-compatible endpoints with no vendor SDK.
# Dormant (no route) until the app writes this row's `config.providers` into the user layer
# $DSH_HOME/profiles/android/cordis.patch.yml (ENGINE-CONTRACT §1.1). Keys never appear there:
# each provider names `apiKeyEnv: DSH_ANDROID_KEY_<ID>`, set in the engine's environment.
# The row exists only here; the user layer replaces its `config` (patch layers never deep-merge).
- insert:
    - id: llm-service-lite
      name: '@snnh/dsh-llm-service-lite'

# ── DSH-Android plugins ────────────────────────────────────────────────────
- insert:
    - id: android-device
      name: '@dsh-android/plugin-device'
      # Per-tool timeouts come from each ToolDescriptor's timeoutMs (ENGINE-CONTRACT §3.1).

    - id: android-guard
      name: '@dsh-android/plugin-guard'
      config:
        locale: !!js "process.env.DSH_ANDROID_LOCALE || ''"
        # Built-ins that mutate state outside the device bridge and therefore ask
        # for approval (no OS sandbox on Android) — except read-only shell commands and
        # write/edit inside HOME/TMPDIR, which plugin-guard allows directly.
        askTools: [bash, write, edit]

    # Session modes (ENGINE-CONTRACT §2.5): the app sends each conversation's mode with
    # android/session/mode; the plugin hides the tools the mode leaves out (per agent,
    # subagents follow their root), turns the skill catalog off, adds the mode's prompt.
    - id: android-mode
      name: '@dsh-android/plugin-mode'

    # DeepSeek account login. dsh-base mounts the account provider
    # (`deepseek-account`, OAuth + PKCE against platform.deepseek.com) and the
    # `deepseek-account` model route; this row adds the loopback callback
    # server they need and exposes the account operations and events on the
    # SDK channel (account/* methods, account.* notifications).
    - id: android-account
      name: '@dsh-android/plugin-account'
      config:
        locale: !!js "process.env.DSH_ANDROID_LOCALE || ''"
        # The completion page in the in-app sign-in WebView opens this app link.
        appScheme: dsh-android
        appPackage: !!js "process.env.DSH_ANDROID_PACKAGE || ''"
